name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Regenerar árvore e lockfile em ambiente limpo
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Commitar lockfile quando necessário
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock já sincronizado"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: regenerar lockfile do Workflow SDK"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Validar instalação reproduzível
        run: |
          rm -rf node_modules
          npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build
