name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, Tipos e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Atualizar npm para regeneração do lockfile
        run: npm install -g npm@11

      - name: Instalar dependências e regenerar lockfile
        run: npm install

      - name: Persistir lockfile regenerado
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): regenerar package-lock"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Auditar dependências
        run: npm audit --audit-level=high

      - name: Checar tipos TypeScript
        run: npx tsc --noEmit

      - name: Lint de código
        run: npm run lint

      - name: Testes automatizados
        run: npm test

      - name: Build de verificação da aplicação
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-key' }}
